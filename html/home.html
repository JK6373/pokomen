<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home.css">
    <title>l7card</title>
</head>
<body>

<!-- sidebar -->
    <nav class="sidebar">
        <div class="img-logo">
            <a class="img" href="#"><img src="/Pic/90s-logo-dark-pc.svg" alt="Logo"></a>
        </div>
        <div class="contant"></div>
        <div class="sidebar-line"></div>
        <div class="title">
            <p>Pull & Earn</p>
        </div>
        <div class="collapse-navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <img src="/Pic/icon/chart-bar-white.svg" alt="chart-bar-white">
                    <a class="nav-link" href="#">Leaderboard</a>
                </li>
                <li class="nav-item">
                    <img src="/Pic/icon/target-arrow-white.svg" alt="target-arrow-white">
                    <a class="nav-link" href="#">Mission & Reward</a>
                </li>
                <li class="nav-item">
                    <img src="/Pic/icon/users-svgrepo-white.svg" alt="users-svgrepo-white">
                    <a class="nav-link" href="#">Refer & Earn</a>
                </li>
            </ul>
        </div>
    </nav>
<!-- hearder section -->

<header class="top-section">
    <div class="humbeger">
        <a href="#">
            <img src="/Pic/icon/align-text-justify-white.svg" alt="align-text-justify-white">
        </a>
    </div>
    <div class="btn">
        <button>
            <img src="/Pic/icon/music-white.svg" alt="music-white">
        </button>
        <button>
            <img src="/Pic/icon/volume-low-white.svg" alt="volume-low-white">
        </button>
        <a class="login-button" href="#">Login / Sign Up</a>
    </div>
</header>

<section class="main-content">

    <div class="pack-list">    
<!-- STARTER PACK -->
        <div class="starter-pack">
            <div class="pack-content">
                <h3 class="pack-title">STARTER PACK</h3>
                <p class="pack-description">RM200 <span>/ pack</span></p>
            </div>

            <div class="pack-amount">
                <span class="top-chase">TOP CHASE</span>
                <span class="top-amount">RM557.67</span>
            </div>        

            <div class="pack-image">
                <img src="/Pic/starter.png" alt="starter">   
            </div>
            
            <div class="pack-image-right">
                <img src="/Pic/green-medium.png" alt="green-medium">   
            </div>
        </div>

<!-- SILVER PACK -->
        <div class="silver-pack">
            <div class="pack-content">
                <h3 class="pack-title">SILVER PACK</h3>
                <p class="pack-description">RM500 <span>/ pack</span></p>
            </div>

            <div class="pack-amount">
                <span class="top-chase">TOP CHASE</span>
                <span class="top-amount">RM833.67</span>
            </div>        

            <div class="pack-image">
                <img src="/Pic/silver.png" alt="silver-pack">   
            </div>
            
            <div class="pack-image-right">
                <img src="/Pic/pika-medium.png" alt="pika-medium">   
            </div>
        </div>

        <!-- GOLD PACK -->
        <div class="gold-pack">
            <div class="pack-content">
                <h3 class="pack-title">GOLD PACK</h3>
                <p class="pack-description">RM1000 <span>/ pack</span></p>
            </div>

            <div class="pack-amount">
                <span class="top-chase">TOP CHASE</span>
                <span class="top-amount">RM5433.45</span>
            </div>        

            <div class="pack-image">
                <img src="/Pic/gold.png" alt="gold-pack">   
            </div>
            
            <div class="pack-image-right">
                <img src="/Pic/gira-medium.png" alt="gira-medium">   
            </div>
        </div>
        
        <!-- DIAMOND PACK -->
        <div class="diamond-pack">
            <div class="pack-content">
                <h3 class="pack-title">DIAMOND PACK</h3>
                <p class="pack-description">RM2000 <span>/ pack</span></p>
            </div>

            <div class="pack-amount">
                <span class="top-chase">TOP CHASE</span>
                <span class="top-amount">RM7155.20</span>
            </div>        

            <div class="pack-image">
                <img src="/Pic/diamond.png" alt="diamond-pack">   
            </div>
            
            <div class="pack-image-right">
                <img src="/Pic/yibu-medium.png" alt="yibu-medium">   
            </div>
        </div>
    </div>

<!-- VEDIO BACKDGROUND -->
    <div class="background-video">
        <video autoplay muted loop playsinline preload="auto">
            <source src="/video/background.webm"type="video/webm">
            <source src="/video/background.mp4"type="video/mp4">
        </video>
    </div>


<!-- POKEMON PACKET -->
    <div class="flex-content">
        <button class="pack-item pack-far" type="button">
            <img src="/Pic/starter.png" alt="Starter Pack">
        </button>

        <button class="pack-item pack-near" type="button">
            <img src="/Pic/silver.png" alt="Silver Pack">
        </button>

        <button class="pack-item active" type="button">
            <img src="/Pic/gold.png" alt="Gold Pack">
        </button>

        <button class="pack-item pack-near" type="button">
            <img src="/Pic/diamond.png" alt="Diamond Pack">
        </button>

        <button class="pack-item pack-far" type="button">
            <img src="/Pic/starter.png" alt="Starter Pack">
        </button>
    </div>  

    <div></div>

<p>123</p>

</section>




</body>
</html>
